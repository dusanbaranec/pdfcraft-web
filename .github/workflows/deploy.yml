   name: Deploy PdfCraft web

   on:
     workflow_dispatch:
     push:
       branches: [main]
     schedule:
       - cron: "0 6 * * 1"   # weekly, picks up new releases

   permissions:
     contents: read
     pages: write
     id-token: write

   concurrency:
     group: pages
     cancel-in-progress: true

   jobs:
     deploy:
       runs-on: ubuntu-latest
       environment:
         name: github-pages
         url: ${{ steps.deployment.outputs.page_url }}
       steps:
         - name: Download latest PdfCraft web release
           env:
             GH_TOKEN: ${{ github.token }}
           run: |
             gh release download --repo storytold/pdfcraft \
               --pattern 'pdfcraft-web-*.zip' --pattern 'SHA256SUMS.txt'
             grep 'pdfcraft-web-.*\.zip' SHA256SUMS.txt | sha256sum -c -
             unzip -q pdfcraft-web-*.zip -d site
             mv site/pdfcraft-web-*/ public
             touch public/.nojekyll

         - uses: actions/configure-pages@v5
         - uses: actions/upload-pages-artifact@v3
           with:
             path: public
         - id: deployment
           uses: actions/deploy-pages@v4
